[package]
name = "openloop-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam = "0.34"
libc = "0.2"
openloop-protocol = { path = "../protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-video-toolbox = "0.3"
openloop-ipc = { path = "../ipc" }

[lints]
workspace = true
