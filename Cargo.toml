[workspace]
resolver = "3"
members = ["packages/rust/*", "apps/quest", "apps/openloopd"]
default-members = ["packages/rust/*", "apps/openloopd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
openloop-openxr-abi = { path = "packages/rust/openxr-abi" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
debug = "line-tables-only"
panic = "unwind"
